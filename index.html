*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--g);color:#fff;padding:12px 56px;text-align:center;font-weight:700;font-size:18px;border-bottom:4px solid var(--y);position:relative;min-height:56px;display:flex;align-items:center;justify-content:center}
#back{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;margin:0;padding:0;background:transparent;color:#fff;font-size:28px;line-height:1;border-radius:50%;visibility:hidden}
#back:active{background:#ffffff33}
main{flex:1;padding:16px;max-width:560px;width:100%;margin:0 auto}
.card{background:var(--c);border-radius:14px;padding:16px;box-shadow:0 1px 4px #0002;margin-bottom:12px}
button,a.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px;width:100%;margin-bottom:10px;background:var(--g);color:#fff;font-weight:600;font-size:16px;display:block;text-align:center;text-decoration:none}
button.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
button.opt{background:#fff;color:var(--t);border:2px solid #d5dbd5;text-align:left;font-weight:500}
button.ok{background:#d9f5e3;border-color:var(--g)}
button.ko{background:#fde0e3;border-color:var(--r)}
button.gold{background:var(--y);color:#222}
.bar{height:8px;background:#dde3dd;border-radius:6px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);width:0;transition:width .3s}
.q{font-size:18px;font-weight:600;margin-bottom:14px;line-height:1.35}
.sign{width:130px;height:130px;margin:0 auto 14px;display:block}
.sign svg{width:100%;height:100%}
.exp{background:#fff8d6;border-left:4px solid var(--y);padding:10px;border-radius:8px;margin:8px 0 12px;font-size:15px}
.big{font-size:44px;font-weight:800;text-align:center;color:var(--g)}
.muted{color:#667;font-size:14px;text-align:center;margin:6px 0}
.pro{background:var(--y);color:#222;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px}
input{width:100%;padding:12px;border:2px solid #d5dbd5;border-radius:10px;font-size:16px;margin-bottom:10px}
.sep{border:0;border-top:1px solid #dde3dd;margin:16px 0}
.note{font-size:13px;color:#667;text-align:center;margin-bottom:10px}
</style>
</head>

[2,"La visite technique sert à :",["Vérifier que le véhicule est en bon état","Remplacer l'assurance","Choisir la couleur du véhicule"],0,"Elle contrôle freins, feux, pneus, etc."],
[2,"L'assurance du véhicule est :",["Obligatoire pour circuler","Facultative","Réservée aux camions"],0,"Elle protège aussi les victimes en cas d'accident."],
[2,"Dans un tunnel ou sur une voie rapide, il est interdit de :",["Faire demi-tour","Allumer ses feux","Utiliser son clignotant"],0,"Le demi-tour y est extrêmement dangereux."],
[2,"Rouler trop vite :",["Augmente la distance d'arrêt et le risque","Réduit le temps de trajet sans danger","N'a aucun effet"],0,"Plus on va vite, plus on met de temps à s'arrêter."],
[2,"La distance d'arrêt est égale à :",["Distance de réaction + distance de freinage","La distance de freinage seulement","La distance de réaction seulement"],0,"Le conducteur réagit d'abord, puis le véhicule freine."],
/* Sécurité */
[3,"Transporter une personne sur le toit ou dans le coffre est :",["Interdit et très dangereux","Toléré","Permis la nuit"],0,"Ces places ne sont pas prévues pour des passagers."],
[3,"À moto, le conducteur doit :",["Porter un casque homologué bien attaché","Porter un simple chapeau","Rouler sans casque près de chez lui"],0,"Le casque réduit fortement les blessures à la tête."],
[3,"Une moto peut transporter :",["Autant de passagers qu'on peut","Seulement le nombre de places prévues","Toute une famille"],1,"Surcharger rend la moto instable et dangereuse."],
[3,"Les motards doivent respecter :",["Les mêmes règles que les autres usagers","Aucune règle","Seulement les feux"],0,"Code de la route valable pour tous."],
[3,"Vous arrivez derrière un accident :",["Je ralentis et je fais très attention","J'accélère pour dépasser","Je klaxonne"],0,"Pour protéger les victimes et éviter un sur-accident."],
[3,"Pour alerter les secours, il faut donner :",["Le lieu précis, le nombre de victimes et leur état","Seulement son nom","Rien"],0,"Les infos précises aident les secours à arriver vite."],
[3,"Une victime ne réagit plus et ne respire plus :",["J'alerte les secours et je fais les gestes de secours si je sais","Je m'enfuis","Je lui donne à boire"],0,"Chaque minute compte : alerter et agir."],
[3,"Si un véhicule prend feu :",["J'évacue tout le monde et je m'éloigne, puis j'alerte","J'ouvre le capot","Je reste dedans"],0,"La priorité est de sauver les personnes."],
[3,"Devant une route inondée dont on ignore la profondeur :",["Je ne traverse pas","Je traverse vite","J'accélère"],0,"L'eau peut emporter un véhicule en quelques secondes."],
[3,"Les signes de fatigue au volant sont :",["Bâillements, paupières lourdes, perte d'attention : il faut faire une pause","Plus de concentration","Aucun signe"],0,"Arrête-toi dès les premiers signes pour te reposer."]
];
const CATS=["Panneaux","Priorités","Règles de conduite","Sécurité & secours"];

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s), app=$("#app");
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let isPro=ls.get("pro",false), best=ls.get("best",{});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let run=null, screen="home", pushed=false;

/* ---------- Navigation (flèche ← et bouton retour Android) ---------- */
function setScreen(s){
  screen=s; $("#back").style.visibility=s==="home"?"hidden":"visible";
  if(s!=="home"&&!pushed){try{history.pushState({s:1},"");pushed=true}catch(e){}}
}
function goHome(fromPop){
  screen="home"; run=null; $("#back").style.visibility="hidden";
  if(!fromPop&&pushed){pushed=false;try{history.back()}catch(e){}} else pushed=false;
  home();
}
function askLeave(){return screen!=="quiz"||confirm("Quitter l'examen ? Ta progression sera perdue.")}
$("#back").onclick=()=>{if(askLeave())goHome(false)};
window.addEventListener("popstate",()=>{
  if(screen==="home")return;
  if(!askLeave()){try{history.pushState({s:1},"")}catch(e){}return}
  goHome(true);
});

/* ---------- Écrans ---------- */
function pool(cat){
  let all=Q.map((q,i)=>({i,cat:q[0],q:q[1],o:q[2],a:q[3],e:q[4],s:q[5]}));
  if(!isPro) all=all.filter(x=>x.i%5===0);
  return cat==null?all:all.filter(x=>x.cat===cat);
}
function home(){
  setScreen("home");
  const total=Q.length, free=Math.ceil(total/5), n=Math.min(20,pool().length);
  app.innerHTML=`<div class="card"><div class="muted">Prépare ton examen du Code de la route</div>
  <div class="muted">${isPro?"Version Pro ✅ — "+total+" questions":"Version gratuite — "+free+" questions sur "+total}</div></div>
  <button id="ex">📝 Examen blanc (${n} questions)</button>
  ${CATS.map((c,i)=>`<button class="sec" data-c="${i}">${c}${best["c"+i]!=null?" — meilleur : "+best["c"+i]+"%":""}</button>`).join("")}
  ${isPro?"":`<button id="pro" class="gold">🔓 Débloquer Pro <span class="pro">${PRO_PRICE}</span></button>`}
  <div class="muted">Meilleur examen : ${best.ex!=null?best.ex+"%":"—"}</div>`;
  $("#ex").onclick=()=>start(null,20);
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>start(+b.dataset.c,99));
  if($("#pro"))$("#pro").onclick=proScreen;
}
function start(cat,n){
  const p=shuffle(pool(cat)).slice(0,n);
  if(!p.length){alert("Aucune question gratuite dans cette catégorie. Passe en Pro !");return proScreen()}
  run={cat,qs:p,k:0,score:0};show();
}
function show(){
  setScreen("quiz");
  const x=run.qs[run.k];
  const order=shuffle(x.o.map((t,i)=>({t,i})));
  app.innerHTML=`<div class="bar"><i style="width:${run.k/run.qs.length*100}%"></i></div>
  <div class="muted">Question ${run.k+1} / ${run.qs.length}</div>
  <div class="card">${sign(x.s)}<div class="q">${x.q}</div>${order.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join("")}<div id="fb"></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,x));
}
function answer(b,x){
  const ok=+b.dataset.i===x.a; if(ok)run.score++;
  document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i===x.a)o.classList.add("ok")});
  if(!ok)b.classList.add("ko");
  $("#fb").innerHTML=`<div class="exp">${ok?"✅ Bonne réponse. ":"❌ Mauvaise réponse. "}${x.e}</div><button id="nx">${run.k+1<run.qs.length?"Suivant →":"Voir mon résultat"}</button>`;
  $("#nx").onclick=()=>{run.k++;run.k<run.qs.length?show():result()};
}
function result(){
  setScreen("result");
  const pct=Math.round(run.score/run.qs.length*100), win=pct>=PASS*100;
  const key=run.cat==null?"ex":"c"+run.cat; if(best[key]==null||pct>best[key]){best[key]=pct;ls.set("best",best)}
  const cat=run.cat;
  app.innerHTML=`<div class="card"><div class="big">${run.score}/${run.qs.length}</div>
  <div class="muted" style="font-size:18px">${pct}% — ${win?"🎉 Réussi !":"💪 Continue, tu y es presque"}</div></div>
  <button id="again">Recommencer</button><button class="sec" id="h">← Menu</button>
  ${isPro?"":`<button id="pro" class="gold">🔓 Plus de questions avec Pro</button>`}`;
  $("#again").onclick=()=>start(cat,cat==null?20:99);$("#h").onclick=()=>goHome(false);
  if($("#pro"))$("#pro").onclick=proScreen;
}

/* ---------- Paiement Mobile Money (Kkiapay) ---------- */
let kReady=false;
function unlock(txId){
  isPro=true; ls.set("pro",true); ls.set("tx",txId||"ok");
  alert("✅ Paiement reçu ! La version Pro est activée.");
  goHome(false);
}
function onPaid(r){
  const id=r&&(r.transactionId||r.transaction_id||r.id)||"";
  if(!VERIFY_URL){unlock(id);return}
  fetch(VERIFY_URL+(VERIFY_URL.includes("?")?"&":"?")+"id="+encodeURIComponent(id))
    .then(x=>x.json()).then(j=>{ if(j&&j.ok)unlock(id); else alert("Paiement non confirmé. Contacte-nous sur WhatsApp avec ton numéro de transaction : "+id) })
    .catch(()=>alert("Impossible de vérifier le paiement. Contacte-nous sur WhatsApp avec ton numéro de transaction : "+id));
}
function loadK(ok,fail){
  if(typeof openKkiapayWidget==="function"){ok();return}
  const s=document.createElement("script"); s.src="https://cdn.kkiapay.me/k.js";
  s.onload=()=>{
    if(typeof openKkiapayWidget!=="function"){fail();return}
    if(!kReady){
      if(typeof addSuccessListener==="function")addSuccessListener(onPaid);
      if(typeof addFailedListener==="function")addFailedListener(()=>alert("Paiement annulé ou échoué. Tu peux réessayer."));
      kReady=true;
    }
    ok();
  };
  s.onerror=fail; document.head.appendChild(s);
}
function pay(){
  if(!navigator.onLine){alert("Connecte-toi à internet pour payer.");return}
  loadK(()=>{
    if(!kReady){ if(typeof addSuccessListener==="function")addSuccessListener(onPaid); kReady=true }
    openKkiapayWidget({amount:PRO_AMOUNT,key:KKIAPAY_KEY,sandbox:SANDBOX,position:"center",theme:"#0b7a3b"});
  },()=>alert("Impossible de charger le paiement. Vérifie ta connexion et réessaie."));
}
function proScreen(){
  setScreen("pro");
  const msg=encodeURIComponent("Bonjour, je veux le code Pro de l'app Code Route Bénin ("+PRO_PRICE+").");
  const auto=!!KKIAPAY_KEY;
  app.innerHTML=`<div class="card"><div class="q">Version Pro — ${PRO_PRICE}</div>
  <p>✔ Toutes les ${Q.length} questions<br>✔ Tous les panneaux illustrés<br>✔ Mises à jour futures<br>✔ Paiement par Mobile Money (MTN / Moov)</p></div>
  ${auto?`<button id="pay" class="gold">📱 Payer ${PRO_PRICE} par Mobile Money</button>
  <div class="note">Paiement sécurisé. Le Pro s'active automatiquement dès que le paiement est confirmé.${SANDBOX?" <b>(Mode test : aucun argent réel)</b>":""}</div><hr class="sep">`:""}
  <div class="note">${auto?"Un problème de paiement ou un code reçu ?":"Pour acheter, écris-nous sur WhatsApp, puis entre ton code :"}</div>
  <a class="btn" style="background:#25D366" href="https://wa.me/${WHATSAPP}?text=${msg}" target="_blank" rel="noopener">💬 WhatsApp</a>
  <input id="code" placeholder="Entre ton code Pro" autocapitalize="characters">
  <button id="val" class="sec">Valider le code</button>`;
  if(auto)$("#pay").onclick=pay;
  $("#val").onclick=()=>{const c=$("#code").value.trim().toUpperCase();
    if(PRO_CODES.includes(c)){unlock("code")}else alert("Code invalide")};
}

home();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
